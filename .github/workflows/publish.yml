name: Publish to npm

# Triggers when a GitHub Release is published (e.g. tag v1.2.3).
# Set NPM_TOKEN in Settings → Secrets → Actions before the first publish.
on:
  release:
    types: [published]

permissions: read-all

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # required for npm provenance attestation

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ── Rust toolchain ──────────────────────────────────────────────────────

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workdir: rust

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # ── Node.js ─────────────────────────────────────────────────────────────

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # ── Build ───────────────────────────────────────────────────────────────

      - name: Build WASM package
        run: wasm-pack build --target web --out-dir pkg --release --scope lychee-org
        working-directory: rust

      - name: Run Node smoke test against the built package
        run: node test/smoke.mjs
        working-directory: rust

      # ── Version ─────────────────────────────────────────────────────────────

      - name: Stamp version from release tag
        # Release tag is e.g. "v1.2.3"; npm version must be "1.2.3".
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
        working-directory: rust/pkg

      # ── Publish ─────────────────────────────────────────────────────────────

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: rust/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
