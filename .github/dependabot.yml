version: 2
updates:
  # Keep GitHub Actions pinned SHAs up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Rust / Cargo dependencies
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    groups:
      rust-deps:
        patterns: ["*"]
